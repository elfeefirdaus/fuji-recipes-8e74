.wrap{max-width:620px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 40px)}
a{color:var(--lime)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.top{display:flex;align-items:center;gap:8px;min-height:48px;margin-bottom:6px}
a.homeapp,.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;min-width:44px;padding:0 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--text);text-decoration:none;font-weight:600;font-size:15px}
a.homeapp:focus-visible,.back:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.homeapp .ar,.back .ar{color:var(--lime)}
.top .sp{flex:1}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:6px 0 2px;display:flex;align-items:center;gap:12px}h1 .ttl{color:var(--text)}h1 .ttl span{color:var(--lime)}
.logo{flex:none;width:52px;height:52px;border-radius:14px;box-shadow:0 0 0 1px rgba(198,244,50,.22),0 6px 18px rgba(0,0,0,.5);display:block}
.credit-line{color:var(--muted);font-size:13.5px;font-style:italic;margin:2px 0 6px;letter-spacing:.01em}.credit-line .hrt{color:var(--lime);font-style:normal}
.sub{color:var(--muted);font-size:14px;margin-bottom:14px}
.search{position:relative;display:block;margin-bottom:10px}
.search input{width:100%;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:16px;padding:0 14px 0 40px}
.search svg{position:absolute;left:13px;top:14px;width:18px;height:18px;stroke:var(--muted)}
.filters{display:flex;gap:8px;margin-bottom:10px}
.filters select{flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:15px;padding:0 10px;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,#9a9ea8 50%),linear-gradient(135deg,#9a9ea8 50%,transparent 50%);background-position:calc(100% - 16px) 19px,calc(100% - 11px) 19px;background-size:5px 5px;background-repeat:no-repeat}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--lime);border-color:var(--lime);color:var(--limeInk)}
.count{color:var(--muted);font-size:13px;margin:2px 2px 10px}
.list{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;text-align:left;display:block;width:100%;color:inherit;text-decoration:none}
.card:active{transform:scale(.98)}
.thumb{aspect-ratio:3/2;background:#20232b center/cover;display:block;width:100%;object-fit:cover}
.thumb.fail{display:grid;place-items:center;color:var(--muted);font-size:12px}
.card .b{padding:10px 11px 12px}
.card .n{font-weight:700;font-size:15px;line-height:1.25}
.card .s{color:var(--lime);font-size:12.5px;font-weight:600;margin-top:4px}
.card .a{color:var(--muted);font-size:12px;margin-top:2px}
.heart{position:absolute;top:6px;right:6px;width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
.heart i{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:rgba(11,12,15,.72);font-style:normal;font-size:17px;color:#fff}
.heart.on i{color:var(--lime)}
.empty{color:var(--muted);text-align:center;padding:40px 10px;grid-column:1/-1}
/* detail */
.gal{position:relative;margin:4px -16px 0;}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:3/2;background:#14161b;display:grid;place-items:center;overflow:hidden}
.slide img{width:100%;height:100%;object-fit:contain;display:block}
.slide .fb{color:var(--muted);text-align:center;padding:20px;font-size:14px;line-height:1.5}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(11,12,15,.6);color:#fff;font-size:22px;display:grid;place-items:center}
.nav.prev{left:8px}.nav.next{right:8px}
.dots{display:flex;justify-content:center;gap:6px;margin:10px 0 2px}
.dots button{width:8px;height:8px;border-radius:50%;background:#3a3e48;padding:0}
.dots button.on{background:var(--lime);width:20px;border-radius:4px}
.credit{color:var(--muted);font-size:12px;text-align:center;margin-bottom:12px}.credit a{color:var(--muted)}
h2{font-size:26px;font-weight:800;letter-spacing:-.01em;line-height:1.15;margin-top:6px}
.by{color:var(--muted);font-size:14px;margin-top:4px}.by b{color:var(--text);font-weight:600}
.desc{font-size:15px;line-height:1.45;margin-top:12px}
.best{font-size:14px;line-height:1.45;color:var(--muted);margin-top:6px}.best b{color:var(--lime);font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--card2);border:1px solid var(--line)}
.tag.sim{background:var(--lime);color:var(--limeInk);border-color:var(--lime)}
.actions{display:flex;gap:10px;margin:16px 0}
.btn{flex:1;min-height:50px;border-radius:14px;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.pri{background:var(--lime);color:var(--limeInk)}
.btn.sec{background:var(--card);border:1px solid var(--line);color:var(--text);flex:0 0 auto;padding:0 18px}
.btn.sec.on{color:var(--lime);border-color:var(--lime)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;font-size:14.5px}
td{padding:11px 14px;border-top:1px solid var(--line);vertical-align:top;line-height:1.35}
tr:first-child td{border-top:0}
td.k{color:var(--muted);width:46%}td.v{font-weight:650;text-align:right}
.note{margin-top:12px;background:var(--card2);border:1px solid var(--line);border-left:3px solid var(--lime);border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.45}
.cams{margin-top:14px;font-size:13.5px;line-height:1.45;color:var(--muted)}.cams b{color:var(--text)}
.src{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;font-size:13.5px;line-height:1.5;color:var(--muted)}
.src a{font-weight:600}
footer{color:var(--muted);font-size:12px;text-align:center;margin-top:28px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%) translateY(20px);background:var(--lime);color:var(--limeInk);font-weight:700;padding:12px 18px;border-radius:999px;box-shadow:0 8px 30px rgba(0,0,0,.5);opacity:0;transition:.25s;pointer-events:none;z-index:50;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    '<p class="credit">Sample photos: '+esc(r.site)+' · <a href="'+esc(r.url)+'" target="_blank" rel="noopener">source page</a></p>'
   :'<p class="credit"><a href="'+esc(r.url)+'" target="_blank" rel="noopener">View samples on source ↗</a></p>';
  app.innerHTML='<div class="top"><button class="back" id="back" aria-label="Back to recipe list"><span class="ar">‹</span> Recipes</button><div class="sp"></div>'+home()+'</div>'+gal+
   '<h2>'+esc(r.name)+'</h2><p class="by">by <b>'+esc(r.author)+'</b> · '+esc(r.site)+'</p>'+
   '<div class="tags"><span class="tag sim">'+esc(r.sim)+'</span>'+r.sensors.map(function(s){return '<span class="tag">'+esc(s)+'</span>'}).join('')+'</div>'+
   (r.desc?'<p class="desc">'+esc(r.desc)+'</p>':'')+(r.best?'<p class="best"><b>Best for:</b> '+esc(r.best)+'</p>':'')+
   '<div class="actions"><button class="btn pri" id="copy"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15H4.5A1.5 1.5 0 0 1 3 13.5v-9A1.5 1.5 0 0 1 4.5 3h9A1.5 1.5 0 0 1 15 4.5V5"/></svg> Copy recipe</button><button class="btn sec'+(fav?' on':'')+'" id="dfav" aria-pressed="'+fav+'" aria-label="'+(fav?'Remove from':'Add to')+' favourites">'+(fav?'♥ Saved':'♡ Save')+'</button></div>'+
   '<table id="settings"><tbody>'+rows(r).map(function(x){return '<tr><td class="k">'+esc(x[0])+'</td><td class="v">'+esc(x[1])+'</td></tr>'}).join('')+'</tbody></table>'+
   (r.note?'<div class="note">'+esc(r.note)+'</div>':'')+
   (r.cameras?'<p class="cams"><b>Cameras:</b> '+esc(r.cameras)+'</p>':'')+
   '<div class="src">Recipe by <b style="color:var(--text)">'+esc(r.author)+'</b>, published on '+esc(r.site)+'. Settings copied exactly as the source states; blank fields aren\'t listed there.<br><a href="'+esc(r.url)+'" target="_blank" rel="noopener">Open the full recipe ↗</a></div>'+
   '<footer>Sample photos are shown from the source site and belong to their photographers.</footer>';
  scrollTo(0,0);
  document.getElementById('back').onclick=function(){if(history.length>1&&root.__cameFromList)history.back();else location.hash=''};
  document.getElementById('copy').onclick=function(){copyText(formatRecipe(r))};
  document.getElementById('dfav').onclick=function(){var on=toggleFav(st,id);saveState(root.localStorage,st);toast(on?'Saved to favourites':'Removed from favourites');renderDetail(id)};
  var tr=document.getElementById('track');if(tr&&n>1){
    var dots=[].slice.call(document.querySelectorAll('[data-dot]'));
    var idx=function(){return Math.round(tr.scrollLeft/tr.clientWidth)};
    tr.addEventListener('scroll',function(){var i=idx();dots.forEach(function(d,j){d.classList.toggle('on',j===i)})},{passive:true});
    var go=function(i){i=(i+n)%n;tr.scrollTo({left:i*tr.clientWidth,behavior:'smooth'});dots.forEach(function(d,j){d.classList.toggle('on',j===i)})};
    [].forEach.call(document.querySelectorAll('[data-go]'),function(b){b.onclick=function(){go(idx()+(+b.dataset.go))}});
    dots.forEach(function(d){d.onclick=function(){go(+d.dataset.dot)}});
  }
}
function copyText(t){
  var done=function(){toast('Recipe copied ✓')},fail=function(){if(legacy(t))done();else toast('Couldn\'t copy — long-press the table to copy')};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,fail)}else fail();
}
function legacy(t){try{var a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(a);a.select();a.setSelectionRange(0,t.length);var ok=document.execCommand('copy');a.remove();return ok}catch(e){return false}}
root.__copyText=copyText;
app.addEventListener('click',function(e){
  var f=e.target.closest('[data-fav]');if(f){e.stopPropagation();var on=toggleFav(st,f.dataset.fav);saveState(root.localStorage,st);toast(on?'Saved to favourites':'Removed from favourites');renderList();return}
  var o=e.target.closest('[data-open]');if(o&&!cur){listScroll=scrollY;root.__cameFromList=true;location.hash='#/r/'+o.dataset.open}
});
app.addEventListener('keydown',function(e){var o=e.target.closest&&e.target.closest('[data-open]');if(o&&(e.key==='Enter'||e.key===' ')){e.preventDefault();o.click()}});
function route(){var m=location.hash.match(/^#\/r\/([\w-]+)/);if(m&&byId[m[1]])renderDetail(m[1]);else{cur=null;renderList();scrollTo(0,listScroll)}}
addEventListener('hashchange',route);route();
})(typeof window!=='undefined'?window:this);

</script>
</body></html>
